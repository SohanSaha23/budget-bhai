<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<meta name="description" content="Personal expense tracker with budgets, splits, goals and insights. Works offline.">
<title>Budget Bhai — Expense Tracker</title>

<!-- installable web app -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">

<!-- iOS home-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget Bhai">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">

<!-- iPhone launch screens -->
<link rel="apple-touch-startup-image" href="icons/launch-1290x2796.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/launch-1179x2556.png" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/launch-1284x2778.png" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/launch-1170x2532.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/launch-1125x2436.png" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/launch-1242x2688.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/launch-828x1792.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2)">
<link rel="apple-touch-startup-image" href="icons/launch-750x1334.png" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)">
<link rel="apple-touch-startup-image" href="icons/launch-1242x2208.png" media="(device-width:414px) and (device-height:736px) and (-webkit-device-pixel-ratio:3)">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <div id="phone">
    <div id="app">
      <main id="view" class="view"></main>

      <nav id="bottomnav">
        <button class="nav-btn active" data-action="nav" data-view="home">
          <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.5Z"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-btn" data-action="nav" data-view="trans">
          <svg viewBox="0 0 24 24"><path d="M5 3h14a1 1 0 0 1 1 1v17l-3-2-3 2-2-2-2 2-3-2-3 2V4a1 1 0 0 1 1-1Zm3 5h8M8 12h8M8 16h5" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Records</span>
        </button>
        <div class="nav-fab-slot">
          <button id="fab" data-action="fab" aria-label="Add">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg>
          </button>
        </div>
        <button class="nav-btn" data-action="nav" data-view="stats">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke-width="1.9" stroke-linecap="round"/></svg>
          <span>Stats</span>
        </button>
        <button class="nav-btn" data-action="nav" data-view="more">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>
          <span>More</span>
        </button>
      </nav>
    </div>

    <div id="sheet-backdrop" class="hidden" data-action="close-sheet"></div>
    <div id="sheet" class="hidden" role="dialog"></div>
    <div id="toast-wrap"></div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/sheets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
